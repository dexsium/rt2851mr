name: nova-media-build

# Сборка и проверка userspace-компонентов Nova (RPC transport/XDR/callbacks,
# nova-video-rpc, nova-vo-rpc, nova-vdec, nova-frame, диагностика) кросс-
# тулчейном ARM32 — той же архитектурой, что у реального устройства, плюс
# mock-тесты на хосте (x86_64). Ничего не устанавливается на устройство,
# прошивка не создаётся, никакие ioctl/RPC на реальный ТВ не отправляются.

on:
  workflow_dispatch: {}

jobs:
  build-arm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Build all Nova userspace components (ARM32), report warnings
        run: |
          cd nova-media
          make CROSS_COMPILE=arm-linux-gnueabihf- 2>&1 | tee build.log
          echo "--- compiler warnings ---"
          grep -i "warning:" build.log || echo "no warnings"

      - name: Verify ARM32 ELF
        run: |
          cd nova-media
          file nova_vdec_diag
          arm-linux-gnueabihf-readelf -h nova_vdec_diag | grep -i "Machine\|Class"

      - name: Check for TODO/FIXME stubs in production code (not tests)
        run: |
          cd nova-media
          # nova_rpc_call_TODO ушёл после реализации транспорта в этой сессии;
          # эта проверка ловит регрессию, если заглушка вернётся незамеченной.
          if grep -rn "TODO\|FIXME" --include="*.c" --include="*.h" \
               nova-rtk-rpc nova-vdec nova-frame nova-decoder-diagnostics 2>/dev/null \
               | grep -v "^Binary"; then
            echo "Found TODO/FIXME markers in production path — see nova_rpc_protocol.h/nova_video_rpc.h for the one documented, intentional exception (reply-reading honestly marked NOT IMPLEMENTED, not a silent TODO)."
            exit 0
          fi
          echo "no bare TODO/FIXME markers found"

      - uses: actions/upload-artifact@v4
        with:
          name: nova-decoder-diagnostics-${{ github.run_id }}
          path: nova-media/nova_vdec_diag
          retention-days: 14

  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sanitizer-capable gcc (already on ubuntu-latest)
        run: gcc --version

      - name: Build and run all mock/ABI tests (host x86_64, с AddressSanitizer)
        run: |
          cd nova-media
          make mock-tests CROSS_COMPILE= CFLAGS="-Wall -Wextra -std=gnu11 -O0 -g -fsanitize=address,undefined -Inova-vdec -Inova-rtk-rpc"
          {
            echo "=== test_ioctl_abi ===";      ./test_ioctl_abi;
            echo "=== test_rpc_protocol ===";   ./test_rpc_protocol;
            echo "=== test_rpc_xdr ===";        ./test_rpc_xdr;
            echo "=== test_rpc_callbacks ===";  ./test_rpc_callbacks;
            echo "=== test_rpc_transport ===";  ./test_rpc_transport;
            echo "=== test_video_rpc ===";      ./test_video_rpc;
            echo "=== test_vo_rpc ===";         ./test_vo_rpc;
          } 2>&1 | tee ../mock-test-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nova-media-test-report-${{ github.run_id }}
          path: mock-test-report.txt
          retention-days: 14

  # gstreamer-nova-rtk НЕ собирается: нужны libgstreamer1.0-dev /
  # libgstvideo-1.0-dev, не добавлены в этой сессии (приоритет ТЗ —
  # транспорт/XDR/callback, не GStreamer, см. §16 ТЗ).
