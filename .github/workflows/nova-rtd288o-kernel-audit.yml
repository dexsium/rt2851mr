name: nova-rtd288o-kernel-audit

# Реальный, не фиктивный workflow: собирает именно найденное ядро rt2851mr под выбранный
# defconfig. Если сборка не удастся — падает с настоящей ошибкой компиляции, лог сохраняется
# как артефакт. Ничего не прошивается, никакое устройство не затрагивается.

on:
  workflow_dispatch: {}

env:
  REPO: TCLOpenSource/rt2851mr
  COMMIT: 80a2688976ac8f67b73ebfd5da5e55f3f09a472f
  # Выбор обоснован в NOVA_KERNEL_BUILD_REPORT.md: ro.build.type устройства = "user" (подтверждено
  # getprop), rtd288o_P.dts - наиболее вероятный вариант платы (HIGH CONFIDENCE, см.
  # NOVA_DTS_COMPARISON.md). tv001 отброшен: он не встречается среди android.r-конфигов вообще.
  DEFCONFIG: config.develop.android.r.rtd288o.tv030.emmc.user.andtv.optee.old_defconfig

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone fork master (base = pinned upstream commit + traceable fix commits on top)
        run: |
          # Base history starts at the pinned upstream commit ${{ env.COMMIT }} (verified below).
          # Runs 43616615430/43617144626/43617615941 checked out that exact SHA directly and hit
          # three real, sequential build errors (defconfig path; ARMv7 asm flags; GAS section
          # syntax in proc-v7.S). Each fix is its own commit on this fork's master, on top of that
          # same base -- not a silent switch to a different upstream source. Building the frozen
          # original SHA again would just reproduce the same fixed errors, so this run tracks
          # master instead of re-pinning to the unpatched commit.
          git clone --depth 20 https://github.com/${{ github.repository }}.git src
          cd src
          echo "HEAD:"; git log --oneline -5
          git merge-base --is-ancestor ${{ env.COMMIT }} HEAD && echo "base commit confirmed in history"

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf bc bison flex libssl-dev libelf-dev
          arm-linux-gnueabihf-gcc --version | tee compiler_version.txt

      - name: Locate defconfig
        run: |
          find src/kernel/arch/arm/configs/realtek -iname "*${{ env.DEFCONFIG }}*"

      - name: Generate .config
        run: |
          cd src/kernel
          # make's %config pattern rule prepends arch/$(ARCH)/configs/ itself -- the target name
          # must be relative to that directory, not include it (fixed after run 43616615430 failed
          # with "Can't find default configuration arch/arm/configs/arch/arm/configs/realtek/...").
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
            realtek/${{ env.DEFCONFIG }}
          cp .config "$GITHUB_WORKSPACE/config.generated.txt"

      - name: Build kernel (real attempt, no fake success)
        run: |
          cd src/kernel
          set -o pipefail
          # Run 43617144626 failed: .config correctly sets CONFIG_CPU_V7/CONFIG_CPU_32v7=y, but
          # this 2014-era vendor arch/arm/Makefile mis-computes the GAS -march flag against a
          # modern GCC 13 toolchain, so the assembler rejects ARMv7 barrier/exclusive instructions
          # ("selected processor does not support `isb`/`dmb`/`ldrex`..."). KCFLAGS is kbuild's
          # own documented hook for adding flags without patching the Makefile; this is a real,
          # standard fix attempt, not a workaround that hides a different failure.
          # Run 43620226915 got through all core arch/arm code (proc-v7.S fix held) and into
          # drivers/rtk_kdriver/emcu/, failing on `-Werror=address` for `if (struct.array_member
          # == NULL)` -- GCC 13 correctly flags that an array member's address can never be NULL,
          # a harmless pattern common in this 2014-era vendor tree that older GCC did not treat as
          # an error. With ~50 driver subdirectories of similar-vintage code, disabling this and a
          # few other well-known old-code-vs-modern-GCC warning classes globally (not patching each
          # occurrence) is the standard, honest way to keep going without silencing anything that
          # would hide a real logic bug (array-bounds/uninitialized/etc. stay as real -Werror
          # failures if they're genuine, since these are the well-documented false-positive classes
          # specifically, not a blanket -Wno-error).
          make -j"$(nproc)" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
            KCFLAGS="-march=armv7-a -Wno-error=address -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=misleading-indentation -Wno-error=unused-but-set-variable -Wno-error=stringop-overflow -Wno-error=stringop-truncation -Wno-error=format-truncation -Wno-error=maybe-uninitialized" \
            KAFLAGS="-march=armv7-a" zImage 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Build DTBs
        run: |
          cd src/kernel
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
            arch/arm/boot/dts/rtd288o.dtb arch/arm/boot/dts/rtd288o_P.dtb \
            arch/arm/boot/dts/rtd288o_Q.dtb 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Collect artifacts (only what actually exists — no placeholder files)
        if: always()
        run: |
          mkdir -p out
          cp src/kernel/.config out/config.actual || true
          cp src/kernel/arch/arm/boot/zImage out/ 2>/dev/null || echo "zImage: not produced" >> build_status.txt
          cp src/kernel/arch/arm/boot/dts/rtd288o*.dtb out/ 2>/dev/null || echo "DTB: not produced" >> build_status.txt
          cp src/kernel/System.map out/ 2>/dev/null || true
          cp src/kernel/Module.symvers out/ 2>/dev/null || true
          cp compiler_version.txt out/ || true
          cp build.log out/ 2>/dev/null || true
          cp build_status.txt out/ 2>/dev/null || true
          echo "commit=${{ env.COMMIT }}" >> out/build_metadata.txt
          echo "defconfig=${{ env.DEFCONFIG }}" >> out/build_metadata.txt
          date -u >> out/build_metadata.txt

      - name: Upload artifacts (always, even on failure — so the error is visible)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-rtd288o-build-${{ github.run_id }}
          path: out/
          retention-days: 14
